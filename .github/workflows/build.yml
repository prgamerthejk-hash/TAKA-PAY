name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o takapay.zip
      - run: |
          ls -la
          if [ -d takapay ]; then cp -r takapay/. .; fi
          if [ -f takapay/takapay/gradlew ]; then cp -r takapay/takapay/. .; fi
          ls -la
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TakaPay-APK
          path: app/build/outputs/apk/debug/app-debug.apk
